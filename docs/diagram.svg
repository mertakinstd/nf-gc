<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="620" viewBox="0 0 1480 620" role="img" aria-labelledby="title desc">
  <title id="title">nf-gc lifecycle</title>
  <desc id="desc">Minimal nf-gc lifecycle: artifact, shared tracking, artifact mode, reclaimed storage, and process mode as a secondary path.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.055"/>
    </filter>

    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748B"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2F7EDB"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2D9C6B"/>
    </marker>

    <style><![CDATA[
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
      .eyebrow { font-size: 12px; font-weight: 760; letter-spacing: 1.4px; fill:#64748B; }
      .title { font-size: 28px; font-weight: 760; fill:#0F172A; }
      .section { font-size: 19px; font-weight: 700; fill:#0F172A; }
      .body { font-size: 14px; font-weight: 500; fill:#475569; }
      .small { font-size: 13px; font-weight: 500; fill:#64748B; }
      .blue { fill:#1F67C1; }
      .green { fill:#21865D; }
      .purple { fill:#7C3AED; }
    ]]></style>
  </defs>

  

  <!-- Main cards -->
  <g filter="url(#shadow)">
    <rect x="70" y="135" width="230" height="150" rx="24" fill="#FFFFFF" stroke="#D7E0EB"/>
    <rect x="390" y="135" width="300" height="150" rx="24" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="780" y="95" width="380" height="250" rx="28" fill="#F8FBFF" stroke="#BBD9FA"/>
    <rect x="1250" y="135" width="170" height="150" rx="24" fill="#FBF8FF" stroke="#D9C8F6"/>
    <rect x="435" y="390" width="265" height="118" rx="22" fill="#FAFCFB" stroke="#CDE8DC"/>
  </g>

  <!-- Main path arrows -->
  <path d="M300 210 H390" fill="none" stroke="#64748B" stroke-width="2.6" marker-end="url(#arrow-slate)"/>
  <path d="M690 210 H780" fill="none" stroke="#2F7EDB" stroke-width="2.8" marker-end="url(#arrow-blue)"/>
  <path d="M1160 210 H1250" fill="none" stroke="#2F7EDB" stroke-width="2.8" marker-end="url(#arrow-blue)"/>

  <!-- Process branch -->
  <path d="M540 285 V335 C540 360 567 360 567 390" fill="none" stroke="#2D9C6B" stroke-width="2.4" marker-end="url(#arrow-green)"/>

  <!-- Artifact card -->
  <text x="185" y="170" text-anchor="middle" class="eyebrow">INPUT</text>
  <g transform="translate(162,188)">
    <path d="M0 0 h28 l16 16 v43 h-44 z" fill="#F4F7FB" stroke="#5377A8" stroke-width="2"/>
    <path d="M28 0 v16 h16" fill="none" stroke="#5377A8" stroke-width="2"/>
    <line x1="10" y1="31" x2="33" y2="31" stroke="#5377A8" stroke-width="2"/>
    <line x1="10" y1="43" x2="33" y2="43" stroke="#5377A8" stroke-width="2"/>
  </g>
  <text x="185" y="270" text-anchor="middle" class="section">Artifact</text>

  <!-- Tracking card -->
  <text x="540" y="170" text-anchor="middle" class="eyebrow">TRACKING</text>
  <text x="540" y="215" text-anchor="middle" class="title">Track once</text>
  <text x="540" y="252" text-anchor="middle" class="body">Ownership · Lineage · Retention</text>

  <!-- Artifact mode card -->
  <text x="970" y="132" text-anchor="middle" class="eyebrow blue">DEFAULT</text>
  <text x="970" y="174" text-anchor="middle" class="title blue">Artifact mode</text>

  <circle cx="835" cy="218" r="5.5" fill="#2F7EDB"/>
  <text x="853" y="224" class="section">Consumers finished</text>
  <text x="853" y="248" class="small">No Active Concrete Use</text>

  <circle cx="835" cy="282" r="5.5" fill="#2F7EDB"/>
  <text x="853" y="288" class="section">Future demand sealed</text>
  <text x="853" y="312" class="small">No Downstream Use Remains</text>

  <!-- Storage card -->
  <text x="1335" y="170" text-anchor="middle" class="eyebrow purple">STORAGE</text>
  <g transform="translate(1311,190)">
    <ellipse cx="24" cy="8" rx="20" ry="7" fill="none" stroke="#8B5CF6" stroke-width="2.1"/>
    <path d="M4 8 v15 c0 4 9 7.2 20 7.2 s20-3.2 20-7.2 V8" fill="none" stroke="#8B5CF6" stroke-width="2.1"/>
    <path d="M4 23 v15 c0 4 9 7.2 20 7.2 s20-3.2 20-7.2 V23" fill="none" stroke="#8B5CF6" stroke-width="2.1"/>
  </g>
  <text x="1335" y="270" text-anchor="middle" class="section purple">Free Space</text>

  <!-- Process mode card -->
  <text x="567" y="425" text-anchor="middle" class="eyebrow green">PROCESS MODE</text>
  <text x="567" y="458" text-anchor="middle" class="section green">Same artifacts</text>
  <text x="567" y="484" text-anchor="middle" class="section green">Later timing</text>
</svg>