plugins {
    id 'io.nextflow.nextflow-plugin' version '1.0.0-beta.15'
}

version = '0.1.0'

nextflowPlugin {
    nextflowVersion = '26.04.0'

    provider = 'mertakinstd'
    description = 'Conservative in-run garbage collection of eligible Nextflow work artifacts'
    className = 'mertakinstd.plugin.GcPlugin'
    extensionPoints = [
        'mertakinstd.plugin.GcObserverFactory'
    ]

}
