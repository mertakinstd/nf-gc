name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Bootstrap pinned toolchain
        run: ./scripts/bootstrap-dev.sh

      - name: Run test suite
        run: ./test.sh

  release:
    name: Release
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      NPR_API_KEY: ${{ secrets.NPR_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          plugin_version="$(sed -n "s/^version = '\([^']*\)'$/\1/p" build.gradle)"
          if [[ -z "$plugin_version" ]]; then
            echo "Could not read plugin version from build.gradle" >&2
            exit 1
          fi
          expected_tag="v${plugin_version}"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match plugin version $plugin_version (expected $expected_tag)" >&2
            exit 1
          fi
          echo "PLUGIN_VERSION=$plugin_version" >> "$GITHUB_ENV"

      - name: Verify Registry credential
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${NPR_API_KEY:-}" ]]; then
            echo "NPR_API_KEY repository secret is not configured" >&2
            exit 1
          fi

      - name: Bootstrap pinned toolchain
        run: ./scripts/bootstrap-dev.sh

      - name: Publish plugin to Nextflow Registry
        shell: bash
        run: |
          set -euo pipefail
          source env.sh
          make release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          awk -v version="$PLUGIN_VERSION" '
            $0 ~ "^## " version " " { capture=1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "No CHANGELOG.md section found for $PLUGIN_VERSION" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "nf-gc $PLUGIN_VERSION" \
            --notes-file release-notes.md
